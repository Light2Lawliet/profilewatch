services:
  - type: web
    name: profilewatch-api
    runtime: python
    rootDir: src
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: PROFILEWATCH_ACCESS_KEY
        sync: false
      - key: PROFILEWATCH_ALLOWED_ORIGINS
        sync: false
